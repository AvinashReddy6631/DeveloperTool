name: MCP Orchestrator CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # TEST JOB
  # ==========================================================

  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d mcp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:

      OPENAI_API_KEY: "ci-test-key"
      OPENROUTER_API_KEY: "ci-test-key"

      DB_HOST: localhost
      DB_NAME: mcp_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"


      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      # --------------------------------------------------------
      # Initialize database
      # --------------------------------------------------------

      - name: Initialize test database
        run: |
          python postgres_database.py


      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------

      - name: Run tests
        run: |
          python -m pytest -v tests


  # ==========================================================
  # DOCKER BUILD
  # ==========================================================

  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build -t mcp-orchestrator:test .